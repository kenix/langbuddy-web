<?xml version="1.0" encoding="UTF-8"?>
<!--
  The site's mark: a rounded tile in the brand blue with a geometric L.
  The same shape is drawn in pixels by tools/make_icons.py for the .ico
  and the iOS home-screen icon, and the same file is the header's mark,
  so there is one definition of it rather than three.

  No dark-mode variant: the tile carries its own background, so it reads
  on a light tab strip and a dark one alike.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img"
     aria-label="LangBuddy">
  <rect width="100" height="100" rx="22" ry="22" fill="#3f6e9a"/>
  <path d="M34 26 h12 v36 h24 v12 H34 Z" fill="#ffffff"/>
</svg>
